<style>
:root{--paper:#F3F0E8;--ink:#2E3B36;--muted:#6B7770;--line:#DDD8CC;--green:#3E7A64;--gold:#C9A24A;--card:#FAF8F3;--red:#A65A4A;--serif:"Fraunces",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);min-height:100vh}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}
.bar{display:flex;justify-content:space-between;align-items:center;height:60px;gap:12px;flex-wrap:wrap}
.logo{font:700 20px var(--serif)}
.logo b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--green);color:var(--paper);margin-right:8px}
main{padding:28px 0 60px}
.h{font:700 28px/1.2 var(--serif);margin:0 0 14px}
.h3{font:700 20px var(--serif);margin:28px 0 12px}
.h4{font:700 16px var(--sans);margin:16px 0 8px}
.meta{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;border:0;border-radius:10px;padding:10px 16px;background:var(--green);color:#fff;font:700 14px var(--sans);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 14px;font:500 14px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px}
.card h3{font:700 18px/1.3 var(--serif);margin:4px 0}
.card p{margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid2in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.auth{display:grid;gap:12px;max-width:420px}
.auth.wide{max-width:none;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}
label{display:grid;gap:6px;color:var(--muted);font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.sm-in{width:150px;padding:6px 9px}
.msg{color:var(--red);font-size:14px;min-height:18px;margin:0}
.tag{display:inline-block;width:fit-content;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold);color:#2a1d00}
.date{color:#8a6100;font-weight:700;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.wrapx{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
.nowrap{white-space:nowrap}
.qlist{padding-left:20px;margin:8px 0 14px}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;margin-bottom:12px;flex-wrap:wrap}
.timer{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--green)}
.qtext{font:500 20px/1.4 var(--serif);margin:0 0 14px}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--paper));font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;transition:transform .3s;font-size:14px;z-index:20;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.dark{--paper:#1E2723;--ink:#E6E2D6;--muted:#A2ADA6;--line:#34403A;--card:#26322D;--green:#5FA88C;--gold:#D4AE62}
.dark-btn{position:fixed;right:14px;top:72px;z-index:40;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 12px;cursor:pointer;font-size:16px}
.lp-rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.lp-rv.lp-in{opacity:1;transform:none}
.lp-hero{position:relative}
.lp-hero-in{position:relative;z-index:1}
.lp-hero::before,.lp-hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.lp-hero::before{width:340px;height:340px;top:-130px;left:-90px;animation:lpBlob 14s ease-in-out infinite}
.lp-hero::after{width:260px;height:260px;bottom:-110px;right:-70px;animation:lpBlob 18s ease-in-out infinite reverse}
@keyframes lpBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,20px) scale(1.08)}}
@keyframes lpGlow{0%,100%{box-shadow:0 0 0 0 rgba(212,174,98,.45)}50%{box-shadow:0 0 0 12px rgba(212,174,98,0)}}
.lp-b1{animation:lpGlow 2.6s ease-in-out infinite}
.lp-subj span{transition:transform .2s,background .2s}
.lp-subj span:hover{transform:translateY(-3px)}
.lp-stat b{transition:transform .3s}
.lp-stat:hover b{transform:scale(1.08)}
@media(prefers-reduced-motion:reduce){.lp-rv{opacity:1;transform:none;transition:none}.lp-b1,.lp-hero::before,.lp-hero::after{animation:none}}

.rank-no{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#edf4ee;font-weight:800;color:var(--green)}
.rank-row.me{border-color:var(--gold);background:#fffaf0}.award-card{background:linear-gradient(145deg,#fffdf6,#f4ead0);border:1px solid #e7d39e;border-radius:18px;padding:22px;color:#473717}
@media(max-width:600px){.wrap{padding:0 14px}.bar{height:auto;min-height:60px;padding:9px 0}.logo{font-size:17px}.panel,.card{padding:16px}.tabs{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 9px}.chip{white-space:nowrap}.rank-row{grid-template-columns:40px minmax(0,1fr) auto;padding:10px}.h{font-size:25px}}
body.dark{--paper:#121d18;--ink:#e8f0e9;--muted:#a6b7ab;--line:#2d4135;--green:#5eaf87;--gold:#d8b55e;--card:#1c2b23;--shadow:0 12px 34px rgba(0,0,0,.16)}
body.dark .top{background:rgba(18,29,24,.92)}body.dark input,body.dark select,body.dark textarea{background:#17251d;border-color:#344b3b}body.dark th{background:#203329}body.dark .rank-row{background:var(--card)}body.dark .rank-row.me{background:#332d1c}body.dark .award-card{background:linear-gradient(145deg,#3a321f,#282619);color:#f3e5bd;border-color:#76653a}

/* localStorage ba'zi muhitlarda ishlamaydi — xavfsiz wrapper */
const memStore = {};
const safeLS = {
  getItem(k){ try{ return window.localStorage.getItem(k); }catch(e){ return memStore[k] ?? null; } },
  setItem(k, v){ try{ window.localStorage.setItem(k, v); }catch(e){ memStore[k] = String(v); } },
  removeItem(k){ try{ window.localStorage.removeItem(k); }catch(e){ delete memStore[k]; } },
  key(i){ try{ return window.localStorage.key(i); }catch(e){ return Object.keys(memStore)[i] ?? null; } },
  get length(){ try{ return window.localStorage.length; }catch(e){ return Object.keys(memStore).length; } }
};

function bandOf(sinf){ const g = parseInt(sinf) || 8; return g <= 6 ? "5-6" : g <= 8 ? "7-8" : "9-11"; }
function buildSet(fan, band, n, seed){
  const rnd = mulberry(seed), out = [], seen = new Set();
  for(let k = 0; k < n * 4 && out.length < n; k++){
    const q = makeQ(fan, band, rnd);
    if(!q || seen.has(q.s)) continue;
    seen.add(q.s); out.push(q);
  }
  return out;
}
function fanAvailable(f, band){ return f === "Matematika" || BANK.some(q => q[0] === f && q[1] === band); }
function olympStatus(t, u){
  const done = RESULTS.find(r => r.testId === t.id && r.userId === u.id);
  if(done) return ["done", done.ball];
  if(t.sana && t.sana > today()) return ["soon", t.sana];
  return ["open", null];
}

/* ===== SERTIFIKATGA TAYYORLOV (barcha fanlar, qat'iy shartlar) ===== */
const CERT_MIN_TESTS = 5;      // har bir fan bo'yicha kamida 5 ta test
const CERT_MIN_AVG = 85;       // o'rtacha natija kamida 85 ball
const CERT_EXAM_PASS = 80;     // sertifikat imtihonidan kamida 80 ball
const CERT_MAX_ATTEMPTS = 3;   // imtihon urinishlari soni
function fanResults(u, f){
  return RESULTS.filter(r => { if(r.userId !== u.id) return false; const t = TESTS.find(x => x.id === r.testId); return t && !t.kunlik && !t.serf && !t.serfm && !t.tayyorlov && t.fan === f; });
}
// Admin/o'qituvchi yaratgan sertifikat imtihonlari: egasi = o'quvchi id yoki "*" (butun sinf guruhi)
function managedExams(u, f){
  const band = bandOf(u.sinf);
  return TESTS.filter(t => t.serfm && t.fan === f && (t.egasi === u.id || (t.egasi === "*" && t.band === band)));
}
function serfAttempts(u, f){ return TESTS.filter(t => t.serf && t.egasi === u.id && t.fan === f); }
function certStats(u){
  return SUBJECTS.map(f => {
    const rs = fanResults(u, f);
    const n = rs.length, avg = n ? Math.round(rs.reduce((x, r) => x + r.ball, 0) / n) : 0;
    const criteria = n >= CERT_MIN_TESTS && avg >= CERT_MIN_AVG;
    const att = serfAttempts(u, f);
    const managed = managedExams(u, f);
    const exams = att.concat(managed);
    const passedExam = exams.some(t => { const r = RESULTS.find(x => x.testId === t.id && x.userId === u.id); return r && r.ball >= CERT_EXAM_PASS; });
    const open = managed.filter(t => !RESULTS.some(x => x.testId === t.id && x.userId === u.id));
    return {f, n, avg, criteria, passedExam, attempts: att.length, managed: open, ok: criteria && passedExam};
  });
}
function serfStart(f){
  if(!sectionOpen("cert")){ toast("Sertifikat bo'limi yopiq"); return; }
  const u = S.user, band = bandOf(u.sinf);
  const k = serfAttempts(u, f).length + 1;
  const id = "serf-" + u.id + "-" + f + "-" + k;
  if(!TESTS.some(t => t.id === id)){
    const savollar = buildSet(f, band, 10, seedOf(id));
    if(savollar.length < 5){ toast("Bu fan uchun savollar yetarli emas"); return; }
    TESTS.push({id, nom: "Sertifikat imtihoni · " + f + " · " + k + "-urinish", fan: f, band, vaqt: 20, muallif: "system", serf: true, egasi: u.id, savollar});
  }
  startExam(id);
}

  const rule = `Har bir fan uchun shartlar: kamida <b>${CERT_MIN_TESTS}</b> ta test, o'rtacha <b>${CERT_MIN_AVG}</b> ball, so'ng <b>sertifikat imtihonidan</b> kamida <b>${CERT_EXAM_PASS}</b> ball. Imtihon ${CERT_MAX_ATTEMPTS} marta topshiriladi.`;
  return `<p class="meta">${rule} Kunlik testlar fanlarga kirmaydi.</p>
  <div class="card" style="margin:14px 0"><span class="meta">Umumiy tayyorlik: ${okN}/${SUBJECTS.length} fan</span>

  <div class="cards">${rows.map(r => {
    const left = Math.max(0, CERT_MIN_TESTS - r.n);
    let status, action = "";
    if(r.ok){ status = "Tayyor"; action = `<button class="btn sm" data-act="cert-fan" data-f="${esc(r.f)}">Sertifikat olish</button>`; }
    else if(r.criteria && r.managed.length){ status = "Imtihonga tayyor"; action = `<button class="btn sm" data-act="serfm-start" data-id="${esc(r.managed[0].id)}">Sertifikat imtihoni (o'qituvchi)</button>`; }
    else if(!r.criteria){ status = "Tayyorlanmoqda"; action = `<span class="meta">${left ? "Yana " + left + " ta test kerak. " : ""}${r.n ? "O'rtacha " + r.avg + " (kamida " + CERT_MIN_AVG + " kerak)." : ""}</span>`; }
    else if(r.attempts < CERT_MAX_ATTEMPTS){ status = "Imtihonga tayyor"; action = `<button class="btn sm" data-act="serf-start" data-f="${esc(r.f)}">Sertifikat imtihoni (${r.attempts + 1}/${CERT_MAX_ATTEMPTS})</button>`; }
    else { status = "Urinishlar tugadi"; action = `<span class="meta">Imtihondan ${CERT_EXAM_PASS} ball olinmadi. Tayyorlovni takrorlang.</span>`; }
    return `<article class="card">
    <span class="tag">${status}</span>
    <h3>${esc(r.f)}</h3>
    <p class="meta">Testlar: ${r.n}/${CERT_MIN_TESTS} · O'rtacha: ${r.n ? r.avg + "/100" : "—"} · Imtihon: ${r.passedExam ? "o'tildi" : "topshirilmagan"}</p>
    <div style="height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0"><div style="width:${Math.min(100, Math.round(r.n / CERT_MIN_TESTS * 100))}%;height:100%;background:${r.ok ? "#2e7d4f" : "#b8860b"}"></div></div>
    <div class="row" style="gap:8px;flex-wrap:wrap">${action}
      ${r.ok ? "" : `<button class="btn ghost sm" data-act="prep" data-f="${esc(r.f)}">Mashq qilish</button>`}</div></article>`;
  }).join("")}</div>`;
}

/* ===== OTA-ONA: FARZANDNI KUZATISH ===== */
function parentMonitorView(){
  const c = childOf(); if(!c) return childView();
  const todayS = today();
  const daysAgo = n => { const x = new Date(); x.setDate(x.getDate() - n); return x.toISOString().slice(0, 10); };
  const rs = RESULTS.filter(r => r.userId === c.id).sort((a, b) => (b.sana || "").localeCompare(a.sana || ""));
  const avg = rs.length ? Math.round(rs.reduce((s, r) => s + r.ball, 0) / rs.length) : 0;
  const last = rs[0];
  const idle = last ? Math.floor((new Date(todayS) - new Date(last.sana)) / 864e5) : null;
  const level = b => b >= 85 ? ["A'lo", "#2e7d4f"] : b >= 70 ? ["Yaxshi", "#4f7f2e"] : b >= 55 ? ["Qoniqarli", "#b8860b"] : ["Qoniqarsiz", "#b03a2e"];

  const alerts = [];
  if(!rs.length) alerts.push(["warn", "Farzandingiz hali birorta ham test topshirmagan."]);
  else {
    if(idle >= 7) alerts.push(["warn", `So'nggi ${idle} kun ichida test topshirilmagan (oxirgi sana: ${last.sana}).`]);
    if(last.ball < 55) alerts.push(["warn", `So'nggi natija past: ${last.ball} ball. Shu mavzuni birga takrorlash foydali bo'lishi mumkin.`]);
    if(rs.length >= 4){
      const recent = (rs[0].ball + rs[1].ball) / 2, earlier = (rs[2].ball + rs[3].ball) / 2;
      if(recent < earlier - 10) alerts.push(["warn", "Oxirgi natijalar oldingilaridan pastroq. Natijalar pasaymoqda."]);
      else if(recent > earlier + 10) alerts.push(["ok", "Oxirgi natijalar oldingilaridan yaxshiroq. Yaxshi o'sish bor."]);
    }
    if(!alerts.length) alerts.push(["ok", "Hammasi joyida. Natijalar barqaror va test muntazam topshirilmoqda."]);
  }
  const weeks = [0, 1, 2, 3].map(i => {
    const lo = daysAgo((i + 1) * 7);
    const n = rs.filter(r => r.sana > lo && r.sana <= (i === 0 ? todayS : daysAgo(i * 7))).length;
    return [i === 0 ? "Shu hafta" : i + " hafta oldin", n];
  });
  const maxW = Math.max(1, ...weeks.map(w => w[1]));

  const me = userById(S.user.id), notes = (me.notlar || []).slice().reverse();
  return `<div class="row"><h3 class="h3" style="margin:0">${esc(c.ism)} — kuzatuv</h3><div class="row" style="gap:8px"><span class="meta">Sinf: ${esc(c.sinf || "—")}</span><button class="btn ghost sm" data-act="pcsv">Natijalarni CSV yuklash</button></div></div>
  <div class="grid3" style="margin:16px 0">
    <div class="card"><span class="meta">Topshirilgan testlar</span><div style="font:700 28px var(--serif)">${rs.length}</div></div>
    <div class="card"><span class="meta">O'rtacha ball</span><div style="font:700 28px var(--serif)">${avg}</div></div>
    <div class="card"><span class="meta">So'nggi faollik</span><div style="font:700 20px var(--serif)">${last ? esc(last.sana) : "—"}</div></div>
  </div>
  <div style="display:grid;gap:8px;margin-bottom:18px">${alerts.map(([t, m]) => `<div class="card" style="border-left:4px solid ${t === "warn" ? "#b03a2e" : "#2e7d4f"}">${esc(m)}</div>`).join("")}</div>
  <h4 class="h3" style="font-size:18px">So'nggi 4 hafta</h4>
  <div style="display:grid;gap:6px;margin-bottom:18px">${weeks.map(([l, n]) => `<div class="row" style="gap:10px"><span style="min-width:110px" class="meta">${l}</span><div style="flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden"><div style="width:${Math.round(n / maxW * 100)}%;height:100%;background:var(--ink)"></div></div><span class="meta">${n} ta</span></div>`).join("")}</div>
  <h4 class="h3" style="font-size:18px">Natijalar</h4>
  ${rs.length ? `<div class="wrapx"><table><thead><tr><th>Test</th><th>Sana</th><th>Ball</th><th>Daraja</th></tr></thead><tbody>${rs.map(r => {
    const t = TESTS.find(x => x.id === r.testId); const [lv, col] = level(r.ball);
    return `<tr><td>${esc(t ? t.nom : "Test")}</td><td>${esc(r.sana)}</td>
    <td><div style="display:flex;align-items:center;gap:8px"><div style="width:90px;height:8px;background:var(--line);border-radius:99px;overflow:hidden"><div style="width:${r.ball}%;height:100%;background:${col}"></div></div>${r.ball}</div></td>
    <td><span style="color:${col};font-weight:600">${lv}</span></td></tr>`;
  }).join("")}</tbody></table></div>` : '<p class="meta">Hali natijalar yo\'q.</p>'}
  <h4 class="h3" style="font-size:18px;margin-top:22px">Shaxsiy eslatmalar</h4>
  <p class="meta">Faqat siz ko'rasiz. Masalan: uy vazifasi, o'qituvchi bilan suhbat vaqti.</p>
  <div class="row" style="gap:8px"><input id="pNoteIn" placeholder="Eslatma yozing..." style="flex:1"><button class="btn sm" data-act="pnote-add">Qo'shish</button></div>
  <div style="display:grid;gap:8px;margin-top:10px">${notes.length ? notes.map(n => `<div class="card row" style="gap:10px"><div style="flex:1"><span class="meta">${esc(n.sana)}</span><div>${esc(n.matn)}</div></div><button class="btn ghost sm" data-act="pnote-del" data-id="${n.id}">O'chirish</button></div>`).join("") : '<p class="meta">Eslatmalar yo\'q.</p>'}</div>`;
}

function archiveAdd(tur, nom, data, extra){
  ARCHIVE.unshift({id: uid(), tur, nom: String(nom || ""), vaqt: new Date().toISOString(), kim: S.user ? S.user.ism : "", data, extra: extra || []});
}
function restoreArchive(id){
  const i = ARCHIVE.findIndex(a => a.id === id); if(i < 0) return;
  const a = ARCHIVE[i], d = a.data, ex = a.extra || [];
  const addRes = () => ex.forEach(r => { if(!RESULTS.some(x => x.id === r.id)) RESULTS.push(r); });
  if(a.tur === "user"){ if(!USERS.some(u => u.id === d.id)) USERS.push(d); addRes(); }
  else if(a.tur === "test"){ if(!TESTS.some(t => t.id === d.id)) TESTS.push(d); addRes(); }
  else if(a.tur === "news"){ NEWS.unshift(d); }
  else if(a.tur === "bank"){ BANK.push([d.f, d.b, d.s, d.v, d.j, d.id]); }
  ARCHIVE.splice(i, 1);
}

const BG_PRESETS = {
  default: {label:"Standart", bg:""},
  green:   {label:"Yashil", bg:"#E4EFE8"},
  sand:    {label:"Qum rang", bg:"#F5EBD7"},
  sky:     {label:"Osmon", bg:"#E3EEF7"},
  rose:    {label:"Pushti", bg:"#F7E4E1"},
  night:   {label:"Tungi", bg:"#1C2A24"}
};
function bgSetting(){ try{ return JSON.parse(safeLS.getItem("bo_bg") || "null") || {}; }catch(e){ return {}; } }
function lumOf(hex){ const n = parseInt(hex.slice(1), 16); return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; }
function applyBg(){
  const s = bgSetting(), st = document.body.style;
  ["--paper","--ink","--muted","--card","--line"].forEach(p => st.removeProperty(p));
  // tungi rejim o'z ranglarini ishlatadi; tanlangan fon kunduzgi rejimda qo'llanadi
  const color = document.body.classList.contains("dark") ? "" : (s.color || ((BG_PRESETS[s.preset] || {}).bg) || "");
  st.background = color;
  if(!color) return;
  const dark = lumOf(color) < 0.45;
  st.setProperty("--paper", color);
  st.setProperty("--ink", dark ? "#EEF3EF" : "#172b24");
  st.setProperty("--muted", dark ? "#B9C7BE" : "#5d6f65");
  st.setProperty("--card", dark ? "#22332B" : "#ffffff");
  st.setProperty("--line", dark ? "#3a4f44" : "#dce5dd");
}
function childMistakesView(){
  const c = childOf(); if(!c) return childView();
  const rows = [];
  RESULTS.filter(r => r.userId === c.id).forEach(r => {
    const t = TESTS.find(x => x.id === r.testId); if(!t) return;
    t.savollar.forEach((q, k) => { if(r.javoblar[k] !== q.j) rows.push({q, t, a: r.javoblar[k], sana: r.sana}); });
  });
  if(!rows.length) return `<p class="meta">${esc(c.ism)} ning noto'g'ri javoblari yo'q. Ajoyib!</p>`;
  return `<h3 class="h3" style="margin-top:0">${esc(c.ism)} — xato daftari</h3><p class="meta">Farzandingiz noto'g'ri javob bergan savollar. Ularni birga ko'rib chiqing.</p><div class="cards">${rows.map(x => `<article class="card"><span class="meta">${esc(x.t.nom)} · ${esc(x.sana)}</span><p class="qtext" style="font-size:17px;margin:4px 0">${esc(x.q.s)}</p><p class="meta">Javob: <strong>${x.a === undefined ? "yo'q" : "ABCD"[x.a]}</strong> · To'g'ri: <strong>${"ABCD"[x.q.j]}. ${esc(x.q.v[x.q.j])}</strong></p></article>`).join("")}</div>`;
}
function parentSettingsView(){
  const s = bgSetting();
  const cur = s.color ? "custom" : (s.preset || "default");
  const chips = Object.entries(BG_PRESETS).map(([k, p]) => `<button class="chip" aria-pressed="${cur === k}" data-act="bg" data-v="${k}">${p.label}</button>`).join("");
  return `<section class="panel"><h3 class="h3" style="margin-top:0">Sayt orqa foni</h3><p class="meta">Tayyor ranglardan birini tanlang yoki o'zingiz rang tanlang. Sozlama shu brauzerda saqlanadi.</p><div class="tabs">${chips}</div><label style="max-width:260px">Boshqa rang<input type="color" data-bg-color value="${esc(s.color || "#f4f6f2")}"></label></section>`;
}

/* ===== KUNLIK TESTLAR VA TEST BAZASI (funksiyalar) ===== */
function seedOf(str){ let h = 2166136261; for(const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genMath(band, rnd){
  const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  if(band === "5-6"){ const a = R(12, 99), b = R(12, 99); return {s: `${a} + ${b} = ?`, c: a + b}; }
  if(band === "7-8"){ const x = R(2, 15), a = R(2, 12); return {s: `x + ${a} = ${x + a}. x = ?`, c: x}; }
  const x = R(5, 15), y = R(1, 4); return {s: `${x}² − ${y}² = ?`, c: x * x - y * y};
}
function opts(c, rnd){
  const set = new Set([c]);
  while(set.size < 4){ const d = Math.floor(rnd() * 19) - 9; if(d !== 0) set.add(c + d); }
  const arr = [...set];
  for(let i = arr.length - 1; i > 0; i--){ const k = Math.floor(rnd() * (i + 1)); [arr[i], arr[k]] = [arr[k], arr[i]]; }
  return {v: arr.map(String), j: arr.indexOf(c)};
}
function makeQ(f, band, rnd){
  if(f === "Matematika"){ const m = genMath(band, rnd), o = opts(m.c, rnd); return {f, s: m.s, v: o.v, j: o.j}; }
  // faqat shu sinf guruhiga tegishli savollar (boshqa sinf savollari aralashmaydi)
  const src = BANK.filter(q => q[0] === f && q[1] === band);
  if(!src.length) return null;
  const q = src[Math.floor(rnd() * src.length)];
  return {f, s: q[2], v: q[3].slice(), j: q[4]};
}
// Har kuni boshqa savol: kun raqami + o'quvchiga xos siljish. Savollar navbat bilan aylanadi.
function pickDailyBank(f, band, u){
  const pool = BANK.filter(q => q[0] === f && q[1] === band);
  if(!pool.length) return null;
  const day = Math.floor(Date.parse(today() + "T00:00:00Z") / 864e5);
  const off = seedOf(u.id) % pool.length;
  const q = pool[((day + off) % pool.length + pool.length) % pool.length];
  return {f, s: q[2], v: q[3].slice(), j: q[4]};
}
function ensureDaily(u){
  const id = "kun-" + u.id + "-" + today();
  if(TESTS.some(t => t.id === id)) return;
  const g = parseInt(u.sinf) || 8, band = g <= 6 ? "5-6" : g <= 8 ? "7-8" : "9-11";
  const rnd = mulberry(seedOf(id));
  // Matematika avtomatik; boshqa fanlar savol bazasidan kunma-kun aylanib chiqiladi
  const savollar = SUBJECTS.map(f => f === "Matematika" ? makeQ(f, band, rnd) : pickDailyBank(f, band, u)).filter(Boolean);
  TESTS.push({id, nom: "Kunlik test · " + today(), fan: "Barcha fanlar", vaqt: 20, muallif: "system", kunlik: true, egasi: u.id, savollar});
}
function dailyView(){
  const u = S.user;
  ensureDaily(u);
  const id = "kun-" + u.id + "-" + today();
  const t = TESTS.find(x => x.id === id);
  if(!t || !t.savollar.length) return '<p class="meta">Bugun uchun savollar yetarli emas. O\'qituvchilar bazaga savol qo\'shsin.</p>';
  const done = RESULTS.find(r => r.testId === id && r.userId === u.id);

function pdfSafe(t){ return String(t ?? ""); }

function makePdf(t){
  if(!window.jspdf){ toast("PDF kutubxonasi yuklanmadi. Internetni tekshiring."); return; }
  if(!t){ toast("Test topilmadi"); return; }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  const pageW = doc.internal.pageSize.getWidth(), margin = 14;
  let y = 16;
  const rows = RESULTS.filter(r => r.testId === t.id).sort((a, b) => b.ball - a.ball);
  const avg = rows.length ? Math.round(rows.reduce((s, r) => s + r.ball, 0) / rows.length) : 0;
  const maxBall = rows.length ? Math.max(...rows.map(r => r.ball)) : 0;
  doc.setFillColor(23, 107, 75); doc.rect(0, 0, pageW, 28, "F");
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.text("Bilimdon Olimpiada", margin, 12);
  doc.setFontSize(11); doc.text("Test natijalari hisoboti", margin, 20);
  doc.setTextColor(30,40,35); y = 36;
  doc.setFontSize(14); doc.setFont(undefined,"bold"); doc.text(pdfSafe(t.nom), margin, y); y += 7;
  doc.setFont(undefined,"normal"); doc.setFontSize(10);
  doc.text("Fan: " + pdfSafe(t.fan) + " | Savollar: " + t.savollar.length + " | Vaqt: " + t.vaqt + " daqiqa", margin, y); y += 5;
  doc.text("Sana: " + today() + " | Ishtirokchilar: " + rows.length + " | O'rtacha: " + avg + " | Eng yuqori: " + maxBall, margin, y); y += 7;
  const cl = "To'g'ri javoblar: " + t.savollar.map((q,k)=>(k+1)+"-"+("ABCD"[q.j])).join(", ");
  const cw = doc.splitTextToSize(cl, pageW - margin*2);
  doc.setFontSize(9); doc.text(cw, margin, y); y += cw.length*4.2 + 6;
  if(!rows.length){ doc.setFontSize(11); doc.text("Hali javoblar yo'q.", margin, y); }
  else {
    doc.setFillColor(240,245,240); doc.rect(margin, y-4, pageW-margin*2, 8, "F");
    doc.setFont(undefined,"bold"); doc.setFontSize(9);
    doc.text("№", margin+1, y+1); doc.text("O'quvchi", margin+12, y+1);
    doc.text("Sinf", margin+80, y+1); doc.text("Ball", margin+105, y+1); doc.text("Javoblar", margin+120, y+1);
    doc.setFont(undefined,"normal"); y += 8;
    rows.forEach((r,i)=>{
      const u = userById(r.userId);
      if(y > 270){ doc.addPage(); y = 16; doc.setFontSize(9); doc.setFont(undefined,"bold"); doc.text("Davomi: "+pdfSafe(t.nom), margin, y); doc.setFont(undefined,"normal"); y += 8; }
      const name = pdfSafe(u?u.ism:"Noma'lum"), sinf = pdfSafe(u?(u.sinf||"—"):"—");
      const ans = t.savollar.map((q,k)=>{ const a=r.javoblar[k]; return (k+1)+":"+(a===undefined?"-":"ABCD"[a])+(a===q.j?"+":"x"); }).join(" ");
      doc.setFontSize(9); doc.text(String(i+1), margin+1, y);
      doc.text(name.substring(0,28), margin+12, y); doc.text(sinf, margin+80, y);
      doc.setFont(undefined,"bold"); doc.text(String(r.ball), margin+105, y); doc.setFont(undefined,"normal");
      const aw = doc.splitTextToSize(ans, pageW-margin-122);
      doc.text(aw, margin+120, y); y += Math.max(6, aw.length*4)+2;
    });
  }

function startExam(id){
  const t = TESTS.find(x => x.id === id); if(!t) return;
  clearInterval(timerId);
  S.exam = {testId:id, i:0, ans:[], left:t.vaqt * 60};
  timerId = setInterval(tickExam, 1000);
  render();
}
function tickExam(){
  if(!S.exam){ clearInterval(timerId); return; }
  S.exam.left--;
  const el = $("#tm"); if(el) el.textContent = fmtT(S.exam.left);
  if(S.exam.left <= 0) finishExam();
}
function examView(){
  const e = S.exam, t = TESTS.find(x => x.id === e.testId), q = t.savollar[e.i];
  const last = e.i === t.savollar.length - 1;
  return `<section class="panel" style="max-width:720px;margin:0 auto">
    <div class="qhead"><span>${esc(t.nom)} · ${e.i + 1} / ${t.savollar.length}</span>${e.practice ? '<span class="meta">Mashq rejimi</span>' : `<span class="timer" id="tm">${fmtT(e.left)}</span>`}</div>
    <div class="progress"><i style="width:${(e.i / t.savollar.length) * 100}%"></i></div>
    <p class="qtext">${esc(q.s)}</p>
    <div class="opts">${q.v.map((v, k) => `<button class="opt" data-act="ans" data-k="${k}" aria-pressed="${e.ans[e.i] === k}">${"ABCD"[k]}. ${esc(v)}</button>`).join("")}</div>
    ${e.practice && e.ans[e.i] !== undefined ? `<p class="msg" style="color:${e.ans[e.i] === q.j ? 'var(--green)' : 'var(--red)'};font-weight:700">${e.ans[e.i] === q.j ? "✓ To'g'ri!" : "✗ Noto'g'ri. To'g'ri javob: " + "ABCD"[q.j] + ". " + esc(q.v[q.j])}</p>` : ""}
    <div class="row">
      <button class="btn ghost" data-act="cancelExam">Bekor qilish</button>
      <button class="btn" data-act="nextQ" ${e.ans[e.i] === undefined ? "disabled" : ""}>${last ? "Yakunlash" : "Keyingi →"}</button>
    </div>
  </section>`;
}
function finishExam(){
  const e = S.exam; if(!e) return;
  if(e.practice){ S.exam = null; S.tab = "tests"; toast("Mashq yakunlandi. Natija saqlanmadi."); render(); return; }
  clearInterval(timerId);
  const t = TESTS.find(x => x.id === e.testId);
  const ok = t.savollar.reduce((s, q, k) => s + (e.ans[k] === q.j ? 1 : 0), 0);
  const ball = Math.round(ok / t.savollar.length * 100);
  RESULTS.push({id:uid(), testId:t.id, userId:S.user.id, javoblar:e.ans.slice(), ball, sana:today()});
  S.exam = null; S.tab = "mine";
  toast("Test yakunlandi. Natijangiz: " + ball + "/100");
  render();
}

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, k = f.dataset.form;
  if(!k) return;
  const d = Object.fromEntries(new FormData(f));

  if(k === "login"){
    const lock = loginLock(d.l);
    if(lock){ $("#loginMsg").textContent = "Juda ko'p noto'g'ri urinish. " + lock + " soniyadan keyin qayta urinib ko'ring."; return; }
    const ph = await hashPw(d.p);
    const u = USERS.find(x => x.login === d.l && x.ph === ph);
    if(!u){ registerFail(d.l); $("#loginMsg").textContent = "Login yoki parol noto'g'ri."; return; }
    delete FAILS[d.l];
    if(S.gate === "student" && u.rol !== "student"){ $("#loginMsg").textContent = "Bu kirish o'quvchilar uchun. Xodimlar kirishini tanlang."; return; }
    if(S.gate === "staff" && u.rol === "student"){ $("#loginMsg").textContent = "O'quvchilar o'quvchi kabineti orqali kiradi."; return; }
    if(S.gate === "parent" && u.rol !== "parent"){ $("#loginMsg").textContent = "Bu ota-ona kirishi. Faqat ota-ona hisobi kira oladi."; return; }
    if(S.gate === "teacher" && u.rol !== "teacher"){ $("#loginMsg").textContent = "Bu o'qituvchi paneli. Faqat o'qituvchi hisobi kira oladi."; return; }
    if(u.rol === "teacher" && u.status === "pending"){ $("#loginMsg").textContent = "Hisobingiz hali tasdiqlanmagan. Administrator ruxsat berishini kuting."; return; }
    if(u.status === "rejected"){ $("#loginMsg").textContent = "Hisobingiz rad etilgan. Maktab administratoriga murojaat qiling."; return; }
    S.user = u; S.tab = ""; restoreExam(); render(); return;
  }
  if(k === "newUser"){
    if(USERS.some(x => x.login === d.login)) return toast("Bu login band");
    USERS.push({id:uid(), ism:d.ism, login:d.login, ph:await hashPw(d.parol), rol:d.rol, sinf:d.sinf || "", child:d.child || "", status:"active"});
    toast("Hisob yaratildi"); render(); return;
  }
  if(k === "bulkBank"){
    const lines = d.txt.split("\n").map(x => x.trim()).filter(Boolean);
    let ok = 0, bad = 0;
    for(const ln of lines){
      const p = ln.split("|").map(x => x.trim());
      const idx = "ABCD".indexOf((p[7] || "").toUpperCase());
      if(p.length < 8 || !p[2] || p.slice(3, 7).some(x => !x) || idx < 0){ bad++; continue; }
      BANK.push([p[0], p[1], p[2], p.slice(3, 7), idx, uid()]); ok++;
    }
    toast(ok + " ta savol qo'shildi" + (bad ? ", " + bad + " ta qator noto'g'ri formatda" : ""));
    render(); return;
  }
  if(k === "newBank"){
    const v = [d.v0, d.v1, d.v2, d.v3].map(x => (x || "").trim());
    if(!d.s.trim() || v.some(x => !x)) return toast("Savol va 4 ta variantni to'ldiring");
    BANK.push([d.f, d.b, d.s.trim(), v, +d.j, uid()]);
    toast("Savol bazaga qo'shildi"); render(); return;
  }
  if(k === "register"){
    const msg = $("#regMsg");
    if(d.parol.length < 6){ msg.textContent = "Parol kamida 6 belgi bo'lsin"; return; }
    if(USERS.some(x => x.login === d.login)){ msg.textContent = "Bu login band, boshqasini tanlang"; return; }
    const allowed = ["student", "teacher", "parent"];
    const rol = allowed.includes(d.rol) ? d.rol : "student";
    if(rol === "student" && !(d.sinf || "").trim()){ msg.textContent = "Sinfni kiriting (masalan, 8-A)"; return; }
    const status = rol === "teacher" ? "pending" : "active";
    USERS.push({id:uid(), ism:d.ism, login:d.login, ph:await hashPw(d.parol), rol, sinf: rol === "student" ? (d.sinf || "").trim() : "", child:"", status});
    if(rol === "teacher") toast("So'rov yuborildi. Administrator tasdiqlamaguncha kira olmaysiz.");
    else toast("Ro'yxatdan o'tdingiz. Endi tizimga kiring");
    S.authTab = "login";
    render(); return;
  }
  if(k === "newNews"){
    NEWS.unshift({id:uid(), sana:d.sana, sarlavha:d.sarlavha, matn:d.matn});
    toast("Yangilik qo'shildi"); render(); return;
  }
  if(k === "addQ"){
    readDraftMeta();
    const v = [d.v0, d.v1, d.v2, d.v3].map(x => (x || "").trim());
    if(!d.s.trim() || v.some(x => !x)) return toast("Savol va 4 ta variantni to'ldiring");
    S.draft.savollar.push({s:d.s.trim(), v, j:+d.j});
    render(); return;
  }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;

  if(a === "authtab"){ S.authTab = b.dataset.v; render(); }
  else if(a === "gate"){ S.gate = b.dataset.v; render(); }
  else if(a === "back"){ location.hash = ""; S.gate = null; render(); }
  else if(a === "logout"){ clearInterval(timerId); S.gate = null; S.exam = null; S.user = null; S.tab = ""; render(); }
  else if(a === "tab"){ S.tab = b.dataset.v; render(); }
  else if(a === "savePw"){
    const v = $(`[data-pw="${id}"]`).value;
    if(v.length < 6) return toast("Parol kamida 6 belgi bo'lsin");
    userById(id).ph = await hashPw(v); toast("Parol saqlandi"); render();
  }
  else if(a === "delUser"){
    if(id === S.user.id) return;
    const du = userById(id);
    if(du) archiveAdd("user", du.ism + " (" + du.login + ")", du, RESULTS.filter(r => r.userId === id));
    USERS = USERS.filter(x => x.id !== id);
    RESULTS = RESULTS.filter(r => r.userId !== id);
    toast("Hisob o'chirildi"); render();
  }
  else if(a === "approveUser"){
    const u = userById(id); if(!u) return;
    u.status = "active";
    toast(u.ism + " tasdiqlandi — endi kira oladi");
    render();
  }
  else if(a === "rejectUser"){
    const u = userById(id); if(!u) return;
    u.status = "rejected";
    toast(u.ism + " rad etildi");
    render();
  }
  else if(a === "delTest"){
    const dt = TESTS.find(t => t.id === id);
    if(dt) archiveAdd("test", dt.nom, dt, RESULTS.filter(r => r.testId === id));
    TESTS = TESTS.filter(t => t.id !== id);
    RESULTS = RESULTS.filter(r => r.testId !== id);
    toast("Test o'chirildi"); render();
  }
  else if(a === "backup"){
    const blob = new Blob([JSON.stringify({USERS, TESTS, RESULTS, NEWS, BANK, ARCHIVE, sana: today()}, null, 2)], {type: "application/json"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "bilimdon-zaxira-" + today() + ".json";
    link.click();
    toast("Zaxira nusxa yuklab olindi");
  }

function animateLanding(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const items = document.querySelectorAll(".lp-sec, .lp-stat, .lp-card, .lp-subj span, .lp-lc, .lp-foot");
  items.forEach((el, i) => { el.classList.add("lp-rv"); el.style.transitionDelay = (i % 6) * 80 + "ms"; });
  if(reduce){ items.forEach(el => el.classList.add("lp-in")); }
  else {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add("lp-in"); io.unobserve(e.target); }
    }), {threshold: .12});
    items.forEach(el => io.observe(el));
  }
  document.querySelectorAll(".lp-stat b").forEach(b => {
    const n = parseInt(b.textContent, 10);
    if(isNaN(n) || reduce) return;
    let cur = 0; const step = Math.max(1, Math.ceil(n / 30));
    b.textContent = "0";
    const t = setInterval(() => { cur = Math.min(n, cur + step); b.textContent = cur; if(cur >= n) clearInterval(t); }, 45);
  });
}

/* ===== DOIMIY SAQLASH va JONLI YANGILANISH (db) ===== */
const COLS = ["users","tests","results","news","bank","archive","settings"];
let DB = null, saveChain = Promise.resolve();
const lastSaved = {};
function recsOf(col){
  if(col === "bank") return BANK.map(q => ({id:q[5], f:q[0], b:q[1], s:q[2], v:q[3], j:q[4]}));
  return ({users:USERS, tests:TESTS, results:RESULTS, news:NEWS, archive:ARCHIVE, settings:[SETTINGS]})[col];
}
function setList(col, list){
  if(col === "users") USERS = list;
  else if(col === "tests") TESTS = list;
  else if(col === "results") RESULTS = list;
  else if(col === "news") NEWS.splice(0, NEWS.length, ...list);
  else if(col === "bank") BANK = list.map(r => [r.f, r.b, r.s, r.v, r.j, r.id]);
  else if(col === "archive") ARCHIVE = list;
  else if(col === "settings"){ const r = list.find(x => x.id === "main") || list[0]; if(r) SETTINGS = Object.assign({id:"main", cert:false, prep:false}, r, {id:"main"}); }
}
function markSynced(col){
  Object.keys(lastSaved).forEach(k => { if(k.startsWith(col + "/")) delete lastSaved[k]; });
  recsOf(col).forEach(r => { lastSaved[col + "/" + r.id] = JSON.stringify(r); });
}
/* Faqat o'zgargan yozuvlar yuboriladi: har bir yozuv alohida hujjat */
async function syncDb(){
  NEWS.forEach(n => { if(!n.id) n.id = uid(); });
  BANK.forEach(q => { if(!q[5]) q[5] = uid(); });
  for(const col of COLS){
    const seen = new Set();
    for(const rec of recsOf(col)){
      const key = col + "/" + rec.id; seen.add(key);
      const json = JSON.stringify(rec);
      if(lastSaved[key] !== json){ await DB.doc(key).set(rec); lastSaved[key] = json; }
    }
    for(const key of Object.keys(lastSaved)){
      if(key.startsWith(col + "/") && !seen.has(key)){ await DB.doc(key).delete(); delete lastSaved[key]; }
    }
  }
}
function saveSoon(){
  if(!DB) return;
  saveChain = saveChain.then(syncDb).catch(() => toast("Saqlashda xato. Ruxsatni yoki internetni tekshiring."));
}
function subscribe(col){
  DB.collection(col).onSnapshot(async snap => {
    const list = snap.docs.map(d => JSON.parse(JSON.stringify(d.data()))).filter(Boolean);
    setList(col, list);
    const migrated = col === "users" ? await migratePw() : false;
    if(migrated){ Object.keys(lastSaved).forEach(k => { if(k.startsWith("users/")) delete lastSaved[k]; }); }
    else markSynced(col);
    if(isTyping()) pendingRender = true; else scheduleRender();
  }, () => toast("Jonli yangilanish uzildi"));
}
/* Kod bilan qo'shilgan savollar barqaror ID oladi: yangilanishda bazaga faqat yangilari qo'shiladi, o'chirilganlari qaytmaydi */
const hs = t => { let h = 5381; for(const c of t) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
const SEED = (() => { const used = {}; return BANK.map(q => { const b = "s" + hs(q[0] + q[1] + q[2]); used[b] = (used[b] || 0) + 1; const x = q.slice(0, 5); x[5] = used[b] > 1 ? b + "_" + used[b] : b; return x; }); })();
BANK = SEED.map(q => q.slice());
function mergeSeed(){
  const have = new Set(BANK.map(q => q[5])), gone = new Set(ARCHIVE.filter(a => a.tur === "bank" && a.data).map(a => a.data.id));
  let n = 0; SEED.forEach(q => { if(!have.has(q[5]) && !gone.has(q[5])){ BANK.push(q.slice()); n++; } });
  if(n) saveSoon();
}

const SUPA_URL = "https://euswfxkgamhszyjevitu.supabase.co";
const SUPA_KEY = "sb_publishable_71xKp4iuePooZJ-pPS_-xw__q095PIS"; // Supabase → Connect → anon public kaliti (maxfiy emas)
function serverDb(base, key){
  if(!base || !key || key.startsWith("PUBLIC_ANON")) return null;
  const H = {"apikey": key, "Authorization": "Bearer " + key, "Content-Type": "application/json"};
  const rest = base + "/rest/v1/kv";
  const q = (col, id) => "col=eq." + encodeURIComponent(col) + "&id=eq." + encodeURIComponent(id);
  const req = async (url, opt = {}) => {
    const r = await fetch(url, {...opt, headers: {...H, ...(opt.headers || {})}});
    if(!r.ok) throw new Error("db " + r.status);
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  };
  const subs = {}, lastSeen = {};
  const colSnap = async col => {
    const rows = await req(rest + "?col=eq." + encodeURIComponent(col) + "&select=id,data");
    return {docs: rows.map(r => ({id: r.id, data(){ return r.data; }}))};
  };
  /* Boshqa qurilmadagi o'zgarishlarni 8 soniyada bir tekshirish */
  setInterval(async () => {
    if(document.visibilityState !== "visible") return;
    for(const col of Object.keys(subs)){
      try{
        const snap = await colSnap(col);
        const sig = JSON.stringify(snap.docs.map(d => d.data()));
        if(lastSeen[col] !== sig){ lastSeen[col] = sig; subs[col].forEach(cb => cb(snap)); }
      }catch(e){}
    }
  }, 8000);
  return {
    doc(path){
      const [col, id] = path.split("/");
      return {
        async get(){
          const rows = await req(rest + "?" + q(col, id) + "&select=data");
          return {exists: rows.length > 0, data(){ return rows[0] && rows[0].data; }};
        },
        async set(d){
          await req(rest + "?on_conflict=col,id", {
            method: "POST",
            headers: {"Prefer": "resolution=merge-duplicates"},
            body: JSON.stringify({col, id, data: d})
          });
        },
        async delete(){ await req(rest + "?" + q(col, id), {method: "DELETE"}); }
      };
    },
    collection(col){
      return {
        async get(){ return colSnap(col); },
        onSnapshot(cb, errCb){
          (subs[col] = subs[col] || []).push(cb);
          colSnap(col).then(snap => { lastSeen[col] = JSON.stringify(snap.docs.map(d => d.data())); cb(snap); })
                      .catch(() => errCb && errCb(new Error("offline")));
          return () => {};
        }
      };
    }
  };
}

/* ===== PAROL XAVFSIZLIGI (SHA-256) ===== */
async function hashPw(p){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("bilimdon2026:" + p));
  return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function migratePw(){
  let changed = false;
  for(const u of USERS){ if(u.parol){ u.ph = await hashPw(u.parol); delete u.parol; changed = true; } }
  return changed;
}

function loginLock(l){
  const f = FAILS[l];
  if(!f || f.n < 5) return 0;
  const left = Math.ceil((f.until - Date.now()) / 1000);
  if(left > 0) return left;
  delete FAILS[l];

}

}

function localDb(){
  const LS = safeLS;
  try{ LS.setItem("bo:probe", "1"); LS.removeItem("bo:probe"); }catch(e){}
  const subs = {};
  const colDocs = col => { const out = []; for(let i = 0; i < LS.length; i++){ const k = LS.key(i); if(k && k.startsWith("bo:" + col + "/")) out.push({data(){ return JSON.parse(LS.getItem(k)); }}); } return out; };
  const emit = col => (subs[col] || []).forEach(cb => setTimeout(() => cb({docs: colDocs(col)}), 0));
  try{ window.addEventListener("storage", e => { if(e.key && e.key.startsWith("bo:")) emit(e.key.slice(3).split("/")[0]); }); }catch(e){}
  return {
    doc(path){ const k = "bo:" + path; return {
      async get(){ const raw = LS.getItem(k); return {exists: raw !== null, data(){ return raw ? JSON.parse(raw) : undefined; }}; },
      async set(d){ LS.setItem(k, JSON.stringify(d)); emit(path.split("/")[0]); },
      async delete(){ LS.removeItem(k); emit(path.split("/")[0]); }
    }; },
    collection(col){ return {
      async get(){ const docs = colDocs(col); return {size: docs.length, docs}; },
      onSnapshot(cb){ (subs[col] = subs[col] || []).push(cb); setTimeout(() => cb({docs: colDocs(col)}), 0); }
    }; }
  };
}

      if(!savollar.length){ toast("Bu fan uchun savollar yo'q"); return; }
      TESTS.push({id, nom: "Tayyorlov · " + f, fan: f, band, vaqt: 15, muallif: "system", tayyorlov: true, egasi: S.user.id, savollar});
    }
    startPractice(id);
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act^='pnote-'], [data-act='pcsv']"); if(!b || !S.user) return;
  const me = userById(S.user.id); if(!me || me.rol !== "parent") return;
  const act = b.dataset.act;
  if(act === "pnote-add"){
    const inp = document.getElementById("pNoteIn"); const v = inp ? inp.value.trim() : "";
    if(!v){ toast("Eslatma matnini yozing"); return; }
    me.notlar = [...(me.notlar || []), {id: uid(), sana: today(), matn: v}];
    render();
  } else if(act === "pnote-del"){
    me.notlar = (me.notlar || []).filter(n => n.id !== b.dataset.id);
    render();
  } else if(act === "pcsv"){
    const c = childOf(); if(!c) return;
    const rows = RESULTS.filter(r => r.userId === c.id).sort((a, b) => (a.sana || "").localeCompare(b.sana || ""));
    const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const lines = [["Test", "Sana", "Ball"].map(q).join(",")].concat(rows.map(r => {
      const t = TESTS.find(x => x.id === r.testId);
      return [t ? t.nom : "Test", r.sana, r.ball].map(q).join(",");
    }));
    const blob = new Blob(["\uFEFF" + lines.join("\n")], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = (c.ism || "farzand") + "_natijalar.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
});
document.addEventListener("change", e => {
  if(!e.target.matches("[data-child]")) return;
  if(!S.user || !["admin","teacher"].includes(S.user.rol)) return;
  const p = userById(e.target.dataset.child); if(!p || p.rol !== "parent") return;
  p.child = e.target.value;

});
document.addEventListener("change", e => {
  if(!e.target.matches || !e.target.matches("[data-assign]")) return;
  if(!S.user || (S.user.rol !== "admin" && S.user.rol !== "teacher")) return;
  const u = userById(e.target.dataset.assign); if(!u || u.rol !== "student") return;

document.addEventListener("input", e => {
  if(!e.target.matches("[data-bg-color]")) return;
  safeLS.setItem("bo_bg", JSON.stringify({color: e.target.value}));
  applyBg();
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act='section-toggle']"); if(!b || !canManage()) return;
  const k = b.dataset.k; if(!(k in SETTINGS) || k === "id") return;
  SETTINGS[k] = !SETTINGS[k];

let refreshing = false;
async function refreshAll(){
  if(!DB || refreshing || S.exam || isTyping()) return;
  refreshing = true;
  try{
    await saveChain.catch(() => {});
    for(const col of COLS){
      const snap = await DB.collection(col).get();
      setList(col, snap.docs.map(d => JSON.parse(JSON.stringify(d.data()))).filter(Boolean));
      markSynced(col);
    }
    scheduleRender();
  }catch(e){}
  refreshing = false;
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refreshAll(); });
window.addEventListener("online", refreshAll);
setInterval(() => { if(document.visibilityState === "visible") refreshAll(); }, 25000);

/* ===== MOBIL 2.0 QO'SHIMCHALAR ===== */
(function(){
  const _render = render;
  let lastTab = null, lastQ = null;
  const vib = n => { try{ navigator.vibrate && navigator.vibrate(n); }catch(e){} };
  render = function(){
    const old = document.querySelector(".tabs"), sl = old ? old.scrollLeft : 0;
    _render();
    const tabs = document.querySelector(".tabs"), ex = S.user && S.exam;
    document.body.classList.toggle("in-exam", !!ex);
    if(tabs){ tabs.scrollLeft = sl; if(lastTab !== S.tab){ const a = tabs.querySelector("[aria-pressed=true]"); if(a) tabs.scrollTo({left: a.offsetLeft - tabs.clientWidth/2 + a.clientWidth/2}); if(lastTab !== null) window.scrollTo(0,0); lastTab = S.tab; } }
    document.querySelectorAll("table").forEach(t => {
      if(t.classList.contains("rt")) return;
      const h = [...t.querySelectorAll("thead th")].map(x => x.textContent.trim()); if(!h.length) return;
      t.classList.add("rt"); t.querySelectorAll("tbody tr").forEach(r => [...r.children].forEach((c,i) => c.dataset.l = h[i] || ""));
    });
    if(ex){
      const t = TESTS.find(x => x.id === S.exam.testId), e = S.exam, row = document.querySelector(".row"); if(!t || !row) return;
      const d = document.createElement("div"); d.className = "qdots";
      d.innerHTML = t.savollar.map((_,k) => `<button data-dot="${k}" class="${k===e.i?"cur":e.ans[k]!==undefined?"done":""}" aria-label="${k+1}-savol">${k+1}</button>`).join("");
      document.querySelector(".progress").after(d);
      if(e.i > 0){ const b = document.createElement("button"); b.className = "btn ghost"; b.dataset.act = "prevQ"; b.textContent = "← Oldingi"; row.insertBefore(b, row.lastElementChild); }
      const c = d.querySelector(".cur"); if(c) d.scrollLeft = c.offsetLeft - 60;
      if(lastQ !== e.i){ lastQ = e.i; window.scrollTo(0,0); }
      const tm = document.getElementById("tm"); if(tm) tm.classList.toggle("low", e.left <= 60);
    } else lastQ = null;
  };
  document.addEventListener("click", e => {
    if(!S.exam) return;
    const dot = e.target.closest("[data-dot]"), pv = e.target.closest("[data-act='prevQ']"), op = e.target.closest("[data-act='ans']");
    if(dot){ S.exam.i = +dot.dataset.dot; render(); }
    else if(pv){ S.exam.i = Math.max(0, S.exam.i - 1); render(); }
    else if(op) vib(15);
  });
  document.addEventListener("keydown", e => {
    if(!S.exam || isTyping()) return;
    const k = {"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
    if(k !== undefined){ const b = document.querySelector(`[data-act='ans'][data-k='${k}']`); if(b) b.click(); }
    else if(e.key === "Enter"){ const n = document.querySelector("[data-act='nextQ']"); if(n && !n.disabled) n.click(); }
  });
  /* Imtihon vaqtida tasodifan yopib yuborishdan himoya + ekran o'chmasligi */
  window.addEventListener("beforeunload", e => { if(S.exam && !S.exam.practice){ e.preventDefault(); e.returnValue = ""; } });
  let wl = null; const lock = async () => { try{ if(S.exam && "wakeLock" in navigator && !wl){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => wl = null); } }catch(e){} };
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") lock(); });
  setInterval(() => { if(S.exam) lock(); else if(wl){ wl.release().catch(()=>{}); wl = null; } }, 3000);
  /* Oflayn belgisi va "tepaga" tugmasi */
  const off = document.createElement("div"); off.id = "offline"; off.textContent = "Internet yo'q — o'zgarishlar internet qaytganda saqlanadi"; document.body.append(off);
  const up = document.createElement("button"); up.id = "totop"; up.textContent = "↑"; up.setAttribute("aria-label","Tepaga"); up.onclick = () => window.scrollTo({top:0,behavior:"smooth"}); document.body.append(up);
  const net = () => off.classList.toggle("on", !navigator.onLine);
  addEventListener("online", net); addEventListener("offline", net); net();
  addEventListener("scroll", () => up.classList.toggle("on", scrollY > 500), {passive:true});
  render();
})();
</script>
